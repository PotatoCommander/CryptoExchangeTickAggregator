services:
  postgres:
    image: postgres:16-alpine
    container_name: tickaggregator-postgres
    environment:
      POSTGRES_USER: ticks
      POSTGRES_PASSWORD: ticks
      POSTGRES_DB: ticks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticks -d ticks"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
